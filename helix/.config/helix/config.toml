theme = "adwaita-dark"

[editor]
true-color = true

[editor.cursor-shape]
insert = "bar"
normal = "block"

[editor.file-picker]
hidden = false

[editor.whitespace]
render = "none"

[keys.insert]
j = { k = "normal_mode" }

[keys.normal]
"$" = "goto_line_end"
"0" = "goto_line_start"

[keys.select]
"$" = "goto_line_end"
"0" = "goto_line_start"
